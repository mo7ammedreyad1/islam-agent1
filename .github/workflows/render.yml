name: Ofoq AI Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'المهمة اللي هتتبعت للـ Agent (نص حر بالعربي)'
        required: true
        default: 'اعمل فيديو سورة النصر كاملة، بتفسير ميسّر لكل آية، أفقي.'

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Chrome + Playwright deps
        run: npx playwright install --with-deps chrome

      - name: Run Ofoq AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TASK_JSON: ${{ github.event.inputs.task }}
        run: node agent.js
